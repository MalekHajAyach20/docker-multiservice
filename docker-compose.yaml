
services:
  db:
    image: postgres:16-alpine
    container_name: post
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL" , "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} "]
      interval: 5s # Docker effectue une verif toutes les 5s
      timeout: 5s # Attendre au max 5s pour chaque verif
      retries: 5 # tolèrer jusqu'à 5 vérifications échouées consécutives 
      start_period: 30s
  backend:
    container_name: 'back'
    restart: unless-stopped
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports: 
      - '4000:4000'
    env_file:
      - ./backend/.env 
    networks:
      - app-net
    depends_on:
      db:
        condition: service_healthy 
  frontend:
    container_name: front
    restart: unless-stopped
    build: 
      context: ./frontend 
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    networks:
      - app-net
    depends_on:
      -  backend

volumes:
  db-data:
networks:
  app-net:
    driver: bridge 
